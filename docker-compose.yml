# One command: docker compose up   then open http://localhost:8000
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    environment:
      # Ollama's default context window is small; agent inputs would be cut from the top (the instructions).
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      # keep the model in memory while the run waits for the founder, so calls do not reload it
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    healthcheck:
      test: ["CMD", "ollama", "list"]   # calls /api/tags on the local server
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    # the local open-weight model to download; separate from LLM_MODEL so a hosted free-tier model
    # name in .env does not break the download (the app then waits for a pull that cannot succeed)
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen3:8b}"]
    restart: "no"

  # free local metasearch for the agents' web search (core/tools.py); DuckDuckGo blocks scripts
  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-placeholder-change-me}
    ports:
      - "127.0.0.1:8888:8080"   # also usable from scripts on this machine: SEARXNG_URL=http://localhost:8888
    restart: unless-stopped

  app:
    build: .
    depends_on:
      searxng:
        condition: service_started
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      # a CPU-only laptop writes about 4 tokens per second, so one 1,500-token answer can take 6+ minutes
      LLM_TIMEOUT: ${LLM_TIMEOUT:-900}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1500}
      LLM_NO_THINK: ${LLM_NO_THINK:-auto}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_RETRIES: ${LLM_RETRIES:-6}
      LLM_RETRY_MAX_WAIT: ${LLM_RETRY_MAX_WAIT:-65}
      ORCH_CONCURRENCY: ${ORCH_CONCURRENCY:-1}
      FOUNDER_MODE: ${FOUNDER_MODE:-web}
      APP_PORT: ${APP_PORT:-8000}
      # web search: backends tried in order until 3 results; searxng only when SEARXNG_URL is set
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      SEARCH_BACKENDS: ${SEARCH_BACKENDS:-searxng,bing,hn,duckduckgo}
      TOOL_BUDGET: ${TOOL_BUDGET:-8}
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./decision_log.json:/app/decision_log.json

volumes:
  ollama_models:
