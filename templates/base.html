<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
{% block head %}{% endblock %}
<title>{% block title %}Venture Builder{% endblock %}</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; max-width: 1000px; margin: 0 auto; padding: 0 18px 40px; color: #1d1d1f; line-height: 1.45; }
  nav { display: flex; gap: 18px; align-items: center; padding: 14px 0; border-bottom: 1px solid #e3e3e3; margin-bottom: 18px; }
  nav a { color: #1d1d1f; text-decoration: none; font-weight: 600; }
  nav .brand { margin-right: auto; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 700; }
  .mocked { background: #fff1c7; color: #7a5600; border: 1px solid #e8c45a; }
  .scripted { background: #e6efff; color: #1d4ea8; border: 1px solid #9db8ef; }
  .pending { background: #ffe0dd; color: #a12a1c; }
  .go { background: #dff3e4; color: #186b32; } .stop { background: #ffe0dd; color: #a12a1c; }
  .repeat, .pivot { background: #fff1c7; color: #7a5600; }
  .card { border: 1px solid #e3e3e3; border-radius: 8px; padding: 12px 14px; margin: 12px 0; }
  textarea { width: 100%; min-height: 90px; font: inherit; box-sizing: border-box; }
  pre { white-space: pre-wrap; background: #f6f6f6; padding: 10px; border-radius: 6px; max-height: 420px; overflow: auto; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  td, th { border-bottom: 1px solid #eee; padding: 5px 6px; text-align: left; vertical-align: top; }
  .row { display: flex; gap: 12px; border-bottom: 1px solid #eee; padding: 3px 0; } .row span { flex: 1; }
  button { padding: 6px 14px; cursor: pointer; font: inherit; }
  .muted { color: #6b6b6b; font-size: 13px; }
  blockquote { border-left: 4px solid #e8c45a; margin: 8px 0; padding: 4px 10px; background: #fffaf0; }
</style>
</head>
<body>
<nav>
  <a class="brand" href="/">Venture Builder</a>
  <a href="/approvals">Founder inbox {% if pending %}<span class="badge pending">{{ pending }}</span>{% endif %}</a>
  <a href="/health">Health</a>
</nav>
{% block body %}{% endblock %}
</body>
</html>
